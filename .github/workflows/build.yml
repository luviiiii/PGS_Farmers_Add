name: Build Peers Appraisal exe

on:
  workflow_dispatch:        # lets you press "Run workflow" manually
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: python -m pip install --upgrade pip playwright openpyxl customtkinter pillow pyinstaller

      - name: Create icon
        run: python PGS_Peers_Appraisal.py --make-icon

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PGS_Peers_Appraisal --icon app.ico --collect-all playwright --collect-all customtkinter --hidden-import PIL._tkinter_finder PGS_Peers_Appraisal.py

      - name: Check the exe exists
        run: if (!(Test-Path dist/PGS_Peers_Appraisal.exe)) { throw "exe was not created" }

      - uses: actions/upload-artifact@v4
        with:
          name: PGS_Peers_Appraisal
          path: dist/PGS_Peers_Appraisal.exe
